<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#351451">
  <meta name="description" content="Facilita iPhone: aluguel de iPhone mediante análise.">
  <meta property="og:title" content="Facilita iPhone">
  <meta property="og:description" content="Seu próximo iPhone, do seu jeito.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/assets/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="/assets/og.png">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self' https://connect.facebook.net; connect-src 'self' https://www.facebook.com https://connect.facebook.net; base-uri 'self'; form-action 'self'">
  <title>Facilita iPhone | Verificação</title>
  <link rel="stylesheet" href="/assets/styles.css?v=9">
</head>
<body>
  <div class="page-shell">
    <div class="line-grid" aria-hidden="true"></div>
    <header class="topbar">
      <a class="brand" href="/" aria-label="Facilita iPhone">
        <span class="brand-mark">F</span>
        <span>Facilita iPhone</span>
      </a>
      <span class="topbar-note">Ambiente seguro</span>
    </header>

    <main class="pressel-main">
      <section class="pressel-card" aria-labelledby="pressel-title">
        <span class="eyebrow">Verificação de acesso</span>
        <h1 id="pressel-title">Antes de continuar</h1>
        <p>Confirme que esta solicitação está sendo feita por uma pessoa para acessar a análise.</p>

        <button class="human-check" id="humanCheck" type="button" aria-pressed="false">
          <span class="human-check-box" aria-hidden="true"></span>
          <span class="human-check-copy">
            <strong>Eu não sou um robô</strong>
            <span>Verificação rápida de navegação</span>
          </span>
        </button>

        <button class="primary-button" id="continueButton" type="button" disabled>Continuar</button>
        <p class="pressel-footnote">Seus dados serão protegidos durante todo o processo de análise e contratação.</p>
      </section>
    </main>
  </div>

  <script src="/assets/tracking.js"></script>
  <script src="/assets/pressel.js?v=2"></script>
</body>
</html>
